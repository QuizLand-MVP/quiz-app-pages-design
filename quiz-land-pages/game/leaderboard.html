<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Land | Leaderboard</title>
    <link rel="stylesheet" href="../css/game/leaderboard.css" />
  </head>
  <body>
    <main class="page">
      <section class="leaderboard-panel" aria-label="Leaderboard after question">
        <header class="leaderboard-header">
          <img class="logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />
          <div class="header-copy">
            <h1>Leaderboard</h1>
            <p>Question 4 of 10 · Movie Night</p>
          </div>
        </header>

        <section class="score-list" aria-label="Player scores">
          <article class="score-row">
            <div class="rank rank-blue">1</div>
            <div class="player-info">
              <strong>Alex</strong>
              <div class="score-capsules">
                <span class="score-pill correct">Correct answer 800 points</span>
                <span class="score-pill bonus">Speed bonus +120 points</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width: 92%"></div></div>
            </div>
            <div class="total-score">3,420</div>
          </article>

          <article class="score-row">
            <div class="rank rank-coral">2</div>
            <div class="player-info">
              <strong>Maya</strong>
              <div class="score-capsules">
                <span class="score-pill correct">Correct answer 800 points</span>
                <span class="score-pill bonus">Speed bonus +80 points</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width: 84%"></div></div>
            </div>
            <div class="total-score">3,120</div>
          </article>

          <article class="score-row">
            <div class="rank rank-teal">3</div>
            <div class="player-info">
              <strong>Dad</strong>
              <div class="score-capsules">
                <span class="score-pill correct">Correct answer 800 points</span>
                <span class="score-pill bonus">Speed bonus +40 points</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width: 77%"></div></div>
            </div>
            <div class="total-score">2,860</div>
          </article>

          <article class="score-row">
            <div class="rank rank-yellow">4</div>
            <div class="player-info">
              <strong>Nina</strong>
              <div class="score-capsules">
                <span class="score-pill wrong">Wrong answer 0 points</span>
                <span class="score-pill bonus muted">Speed bonus +0 points</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width: 54%"></div></div>
            </div>
            <div class="total-score">2,020</div>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
