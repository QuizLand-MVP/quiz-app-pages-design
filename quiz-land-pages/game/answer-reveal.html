<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Land | Answer Reveal</title>
    <link rel="stylesheet" href="../css/game/answer-reveal.css" />
  </head>
  <body>
    <main class="page">
      <section class="game-panel answer-panel" aria-label="Answer reveal after question">
        <header class="game-header">
          <img class="logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />

          <div class="round-meta">
            <span>Question 4 of 10</span>
            <p class="eyebrow">Movies</p>
          </div>
        </header>

        <section class="progress-section" aria-label="Game progress">
          <div class="progress-label">
            <span>Progress</span>
            <strong>40%</strong>
          </div>
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </section>

        <section class="question-card card card-blue" aria-label="Answered question">
          <h1>Which movie features a glowing blue energy cube called the Tesseract?</h1>
        </section>

        <section class="answer-card" aria-label="Correct answer">
          <div class="correct-answer">
            <span class="answer-letter">A</span>
            <strong>The Avengers</strong>
          </div>
        </section>

        <section class="explanation-card card card-yellow" aria-label="Explanation">
          <p>
            The Tesseract is the blue Space Stone container that appears in several Marvel movies.
            In The Avengers, Loki uses it to open a portal above New York.
          </p>
        </section>
      </section>
    </main>
  </body>
</html>
