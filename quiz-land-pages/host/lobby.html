<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Land | Game Lobby</title>
    <link rel="stylesheet" href="../css/host/lobby.css" />
  </head>
  <body>
    <main class="page">
      <section class="lobby-panel" aria-label="Game lobby">
        <header class="lobby-header">
          <img class="logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />
          <div>
            <h1>Movie Night</h1>
            <p>Players can join from their phones before the game starts.</p>
          </div>
        </header>

        <section class="join-card card card-blue">
          <div class="qr-box" aria-label="QR code placeholder">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="join-copy">
            <p class="eyebrow">Join at quiz-land.com</p>
            <strong>7429</strong>
            <span>Scan the QR code or enter the game code on your phone.</span>
          </div>
        </section>

        <section class="game-summary" aria-label="Game summary">
          <div>
            <span class="eyebrow">Theme</span>
            <strong>Movies</strong>
          </div>
          <div>
            <span class="eyebrow">Questions</span>
            <strong>10</strong>
          </div>
          <div>
            <span class="eyebrow">Timer</span>
            <strong>30s</strong>
          </div>
        </section>

        <section class="players-section" aria-label="Players joined">
          <div class="section-heading">
            <h2>Players joined</h2>
            <p class="eyebrow">3 / 8</p>
          </div>

          <div class="player-list">
            <article class="player-row">
              <span class="avatar avatar-blue">A</span>
              <div><strong>Alex</strong><span>Ready</span></div>
            </article>
            <article class="player-row">
              <span class="avatar avatar-coral">M</span>
              <div><strong>Maya</strong><span>Ready</span></div>
            </article>
            <article class="player-row">
              <span class="avatar avatar-teal">D</span>
              <div><strong>Dad</strong><span>Choosing color</span></div>
            </article>
          </div>
        </section>

        <footer class="actions">
          <button class="secondary-button" type="button">Return to settings</button>
          <button class="primary-button disabled" type="button" disabled>Start game</button>
        </footer>
      </section>
    </main>
  </body>
</html>
