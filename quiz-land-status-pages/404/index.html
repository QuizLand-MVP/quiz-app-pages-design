<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Land — 404</title>
  <meta name="description" content="This Quiz Land page was not found." />
  <link rel="stylesheet" href="../styles/status.css" />
</head>
<body>
  <main class="page">
    <section class="status-panel" aria-labelledby="not-found-title">
      <header class="status-header">
        <img class="logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />
        <p class="eyebrow">404 page</p>
      </header>

      <div class="status-content">
        <h1 id="not-found-title" class="title">
          <span class="title-blue">Oops!</span>
          <span class="title-coral">Wrong answer.</span>
          <span class="title-teal">Try again?</span>
        </h1>

        <p class="message">
          The link may be old, mistyped, or hiding from the leaderboard.
        </p>
      </div>

      <div class="actions">
        <a class="primary-button" href="/">Back to home</a>
        <a class="secondary-button" href="javascript:history.back()">Go back</a>
      </div>
    </section>
  </main>
</body>
</html>
