<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Land — Maintenance</title>
  <meta name="description" content="Quiz Land is getting a quick tune-up." />
  <link rel="stylesheet" href="../styles/status.css" />
</head>
<body>
  <main class="page">
    <section class="status-panel" aria-labelledby="maintenance-title">
      <header class="status-header">
        <img class="logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />
        <p class="eyebrow">Quick tune-up</p>
      </header>

      <div class="status-content">
        <h1 id="maintenance-title" class="title">
          <span class="title-blue">Quiz Land</span>
          <span class="title-coral">is warming up.</span>
          <span class="title-teal">Back soon!</span>
        </h1>

        <p class="message">
          We are polishing the quiz chaos. Your next game night is not cancelled.
        </p>
      </div>

      <div class="actions">
        <a class="primary-button" href="/">Try again soon</a>
        <a class="secondary-button" href="mailto:hello@quiz-land.com">Contact support</a>
      </div>
    </section>
  </main>
</body>
</html>
