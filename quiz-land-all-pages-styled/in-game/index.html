<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Land | In Game</title>
    <link rel="stylesheet" href="styles/in-game.css" />
  </head>
  <body>
    <main class="page">
      <section class="game-panel" aria-label="In game question screen">
        <header class="game-header">
          <img class="logo" src="assets/quiz-land-logo.png" alt="Quiz Land" />

          <section class="timer-card" aria-label="Question timer">
            <div class="timer-ring">
              <span>24</span>
            </div>
            <span class="timer-label">Seconds left</span>
          </section>

          <div class="round-meta">
            <span>Question 4 of 10</span>
            <strong>Movie Night</strong>
          </div>
        </header>

        <section class="progress-section" aria-label="Question progress">
          <div class="progress-label">
            <span>Progress</span>
            <strong>40%</strong>
          </div>
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </section>


        <section class="question-card" aria-label="Current question">
          <p class="eyebrow">Movies</p>
          <h1>Which movie features a glowing blue energy cube called the Tesseract?</h1>
        </section>

        <form class="answers" aria-label="Answer choices">
          <label class="answer-option selected">
            <input type="radio" name="answer" checked />
            <span class="answer-letter">A</span>
            <strong>The Avengers</strong>
          </label>

          <label class="answer-option">
            <input type="radio" name="answer" />
            <span class="answer-letter">B</span>
            <strong>Jurassic Park</strong>
          </label>

          <label class="answer-option">
            <input type="radio" name="answer" />
            <span class="answer-letter">C</span>
            <strong>Back to the Future</strong>
          </label>

          <label class="answer-option">
            <input type="radio" name="answer" />
            <span class="answer-letter">D</span>
            <strong>Shrek</strong>
          </label>

          <button class="submit-button" type="button">Submit answer</button>
        </form>
      </section>
    </main>
  </body>
</html>
