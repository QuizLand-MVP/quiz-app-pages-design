<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Land — Leaderboard</title>
    <link rel="stylesheet" href="styles/leaderboard.css" />
  </head>
  <body>
    <main class="page" aria-label="Leaderboard after question">
      <section class="game-panel leaderboard-panel">
        <header class="leaderboard-header">
          <img class="logo" src="assets/quiz-land-logo.png" alt="Quiz Land" />
          <div class="leaderboard-title-block">
            <h1>Leaderboard</h1>
            <p class="eyebrow">Question 3 of 10</p>
          </div>
        </header>

        <section class="ranking-section" aria-label="Current ranking">
          <div class="ranking-heading">
            <h2>Current ranking</h2>
            <strong>6 players</strong>
          </div>

          <section class="podium" aria-label="Top three players">
            <article class="podium-card second-place">
              <div class="rank-badge">2</div>
              <div class="avatar avatar-coral">M</div>
              <h3>Maya</h3>
              <p>2,720 pts</p>
            </article>

            <article class="podium-card first-place">
              <div class="rank-badge crown">1</div>
              <div class="avatar avatar-blue">A</div>
              <h3>Alex</h3>
              <p>3,120 pts</p>
            </article>

            <article class="podium-card third-place">
              <div class="rank-badge">3</div>
              <div class="avatar avatar-teal">D</div>
              <h3>Dad</h3>
              <p>2,100 pts</p>
            </article>
          </section>

          <div class="ranking-list" aria-label="Remaining ranking">
            <article class="rank-row">
              <div class="position">4</div>
              <div class="avatar avatar-purple">S</div>
              <div class="rank-copy">
                <h3>Sophia</h3>
              </div>
              <strong>1,860</strong>
            </article>

            <article class="rank-row">
              <div class="position">5</div>
              <div class="avatar avatar-yellow">N</div>
              <div class="rank-copy">
                <h3>Noah</h3>
              </div>
              <strong>1,540</strong>
            </article>

            <article class="rank-row">
              <div class="position">6</div>
              <div class="avatar avatar-slate">L</div>
              <div class="rank-copy">
                <h3>Luna</h3>
              </div>
              <strong>1,120</strong>
            </article>
          </div>
        </section>

        <footer class="leaderboard-actions">
          <button class="submit-button" type="button">
            <span>Next question</span>
            <span class="button-timer">in 5s</span>
          </button>
        </footer>
      </section>
    </main>
  </body>
</html>
