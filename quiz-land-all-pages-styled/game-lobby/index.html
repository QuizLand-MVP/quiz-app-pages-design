<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Land — Game Lobby</title>
    <link rel="stylesheet" href="styles/lobby.css" />
  </head>
  <body>
    <main class="page" aria-label="Game lobby before start">
      <section class="game-panel lobby-panel">
        <header class="lobby-header">
          <img class="logo" src="assets/quiz-land-logo.png" alt="Quiz Land" />
          <div class="lobby-title-block">
            <h1>Movie Night</h1>
            <p>Players can join from their phones before the game starts.</p>
          </div>
        </header>

        <section class="join-card" aria-label="Join game details">
          <div class="qr-card" aria-hidden="true">
            <div class="qr-grid">
              <span></span><span></span><span></span><i></i><b></b><b></b><i></i><span></span><span></span><span></span>
              <span></span><i></i><span></span><b></b><i></i><b></b><i></i><span></span><i></i><span></span>
              <span></span><span></span><span></span><i></i><b></b><i></i><b></b><span></span><span></span><span></span>
              <i></i><b></b><i></i><b></b><span></span><span></span><i></i><b></b><i></i><b></b>
              <b></b><i></i><span></span><i></i><b></b><i></i><span></span><span></span><b></b><i></i>
              <i></i><span></span><b></b><span></span><i></i><b></b><b></b><i></i><span></span><b></b>
              <span></span><span></span><span></span><b></b><i></i><span></span><b></b><span></span><span></span><span></span>
              <span></span><i></i><span></span><b></b><span></span><i></i><b></b><span></span><i></i><span></span>
              <span></span><span></span><span></span><i></i><b></b><i></i><span></span><span></span><span></span><span></span>
              <b></b><i></i><b></b><span></span><i></i><b></b><i></i><b></b><i></i><b></b>
            </div>
          </div>

          <div class="join-copy">
            <p class="eyebrow">Join at quiz-land.com</p>
            <strong class="game-code">7429</strong>
            <p class="join-help">Scan the QR code or enter the game code on your phone.</p>
          </div>
        </section>

        <section class="game-summary" aria-label="Game settings summary">
          <div>
            <span>Theme</span>
            <strong>Movies</strong>
          </div>
          <div>
            <span>Questions</span>
            <strong>10</strong>
          </div>
          <div>
            <span>Timer</span>
            <strong>30s</strong>
          </div>
        </section>

        <section class="players-section" aria-label="Joined players">
          <div class="players-heading">
            <h2>Players joined</h2>
            <strong>3 / 8</strong>
          </div>

          <div class="players-list">
            <article class="player-card">
              <div class="avatar avatar-blue">A</div>
              <div class="player-copy">
                <h3>Alex</h3>
                <p>Ready</p>
              </div>
            </article>

            <article class="player-card">
              <div class="avatar avatar-coral">M</div>
              <div class="player-copy">
                <h3>Maya</h3>
                <p>Ready</p>
              </div>
            </article>

            <article class="player-card">
              <div class="avatar avatar-teal">D</div>
              <div class="player-copy">
                <h3>Dad</h3>
                <p>Choosing color</p>
              </div>
            </article>
          </div>
        </section>

        <footer class="lobby-actions">
          <button class="secondary-button" type="button">Return to settings</button>
          <button class="submit-button disabled" type="button" disabled aria-disabled="true">Start game</button>
        </footer>
      </section>
    </main>
  </body>
</html>
