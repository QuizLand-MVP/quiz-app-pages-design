<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Land — Host Login</title>
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body>
    <main class="page" aria-label="Host login">
      <section class="auth-panel">
        <header class="auth-header">
          <img class="hero-logo" src="assets/quiz-land-logo.png" alt="Quiz Land" />
          <div class="header-copy">
            <p class="eyebrow">Host login</p>
            <h1>Start the quiz chaos</h1>
            <p class="subtitle">Sign in to create a game, invite players, and keep the questions rolling.</p>
          </div>
        </header>

        <section class="login-options" aria-label="Login options">
          <button class="google-button" type="button" aria-label="Continue with Google">
            <span class="google-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z" />
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38z" />
              </svg>
            </span>
            Continue with Google
          </button>

          <div class="divider" role="presentation">
            <span></span>
            <strong>or</strong>
            <span></span>
          </div>

          <form class="email-card" action="#" method="post">
            <label for="host-email">Email address</label>
            <div class="email-row">
              <input id="host-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="host@email.com" required />
              <button class="otp-button" type="submit">Send OTP</button>
            </div>
            <p class="form-hint">We’ll send a one-time code. No password dungeon required.</p>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
