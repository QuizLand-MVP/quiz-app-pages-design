<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Land — Final Leaderboard</title>
    <link rel="stylesheet" href="styles/final-leaderboard.css" />
  </head>
  <body>
    <main class="page" aria-label="Final leaderboard">
      <section class="game-panel leaderboard-panel">
        <header class="completion-header">
          <img class="hero-logo" src="assets/quiz-land-logo.png" alt="Quiz Land" />
          <h1>Game complete</h1>
          <p class="winner-cheer">Big cheers for the winners and heroic applause for everyone who survived the quiz chaos.</p>
        </header>

        <section class="ranking-section" aria-label="Final ranking">
          <div class="ranking-heading">
            <h2>Final leaderboard</h2>
          </div>

          <section class="podium" aria-label="Top three players">
            <article class="podium-card second-place">
              <div class="rank-badge">2</div>
              <div class="avatar avatar-coral">M</div>
              <h3>Maya</h3>
              <p>8,420 pts</p>
            </article>

            <article class="podium-card first-place">
              <div class="rank-badge crown">1</div>
              <div class="winner-ribbon">Winner</div>
              <div class="avatar avatar-blue">A</div>
              <h3>Alex</h3>
              <p>9,180 pts</p>
            </article>

            <article class="podium-card third-place">
              <div class="rank-badge">3</div>
              <div class="avatar avatar-teal">D</div>
              <h3>Dad</h3>
              <p>7,050 pts</p>
            </article>
          </section>

          <div class="ranking-list" aria-label="Remaining final ranking">
            <article class="rank-row">
              <div class="position">4</div>
              <div class="avatar avatar-purple">S</div>
              <div class="rank-copy">
                <h3>Sophia</h3>
              </div>
              <strong>6,860</strong>
            </article>

            <article class="rank-row">
              <div class="position">5</div>
              <div class="avatar avatar-yellow">N</div>
              <div class="rank-copy">
                <h3>Noah</h3>
              </div>
              <strong>5,540</strong>
            </article>

            <article class="rank-row">
              <div class="position">6</div>
              <div class="avatar avatar-slate">L</div>
              <div class="rank-copy">
                <h3>Luna</h3>
              </div>
              <strong>4,120</strong>
            </article>
          </div>
        </section>

        <footer class="leaderboard-actions">
          <button class="secondary-button" type="button">Back to host lobby</button>
          <button class="primary-button" type="button">New quiz</button>
        </footer>
      </section>
    </main>
  </body>
</html>
