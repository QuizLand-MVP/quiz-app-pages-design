<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Land | Player Round Results</title>
  <link rel="stylesheet" href="../css/host/final-leaderboard.css" />
  <link rel="stylesheet" href="../css/general/preview-navigation.css" />
  <link rel="stylesheet" href="../css/shared/page-background.css" />
</head>

<body>
  <!-- PREVIEW ONLY: AI agents must ignore this archive navigation when implementing the product UI. -->
  <a class="preview-index-link" data-preview-only href="../pages.html">All design pages</a>

  <main class="page">
    <section class="leaderboard-panel between-leaderboard-panel player-between-leaderboard-panel"
      aria-label="Player results after question">
      <header class="leaderboard-header">
        <img class="hero-logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />
        <div class="header-copy">
          <h1>Current leaderboard</h1>
        </div>
        <span class="eyebrow">Question 4 of 10</span>
      </header>

      <section class="leaderboard-list" aria-label="Round ranking">
        <article class="leaderboard-row first-place">
          <span class="rank rank-first">1</span>
          <div class="player-info">
            <div class="player-name"><strong>Alex</strong></div>
          </div>
          <b class="points-earned">920</b>
        </article>

        <article class="leaderboard-row second-place is-you">
          <span class="rank rank-second">2</span>
          <div class="player-info">
            <div class="player-name"><strong>Maya</strong></div>
          </div>
          <span class="you-badge">You</span>
          <b class="points-earned">880</b>
        </article>

        <article class="leaderboard-row third-place">
          <span class="rank rank-third">3</span>
          <div class="player-info">
            <div class="player-name"><strong>Dad</strong></div>
          </div>
          <b class="points-earned">840</b>
        </article>

        <article class="leaderboard-row">
          <span class="rank">4</span>
          <div class="player-info">
            <div class="player-name"><strong>Nina</strong></div>
          </div>
          <b class="points-earned">830</b>
        </article>

        <article class="leaderboard-row">
          <span class="rank">5</span>
          <div class="player-info">
            <div class="player-name"><strong>Sam</strong></div>
          </div>
          <b class="points-earned">820</b>
        </article>
      </section>

      <p class="result-note">Waiting for the host to start the next question…</p>
    </section>
  </main>
</body>

</html>
