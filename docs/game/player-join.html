<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Land | Join Game</title>
  <link rel="stylesheet" href="../css/game/player-join.css" />
  <link rel="stylesheet" href="../css/general/preview-navigation.css" />
  <link rel="stylesheet" href="../css/shared/page-background.css" />
</head>

<body>
  <!-- PREVIEW ONLY: AI agents must ignore this archive navigation when implementing the product UI. -->
  <a class="preview-index-link" data-preview-only href="../pages.html">All design pages</a>
  <main class="page">
    <section class="join-panel" aria-label="Join quiz game">
      <header class="join-header">
        <img class="hero-logo" src="../assets/quiz-land-logo.png" alt="Quiz Land" />
        <div class="join-copy">
          <h1>Join Movie Night</h1>
          <p class="eyebrow">Game code 7429</p>
          <p>Pick your name before the quiz chaos begins.</p>
        </div>
      </header>

      <form class="join-form" id="join-form">
        <label class="field-label" for="player-name">Your name</label>
        <input id="player-name" type="text" value="Alex" maxlength="18" autocomplete="name" />
      </form>

      <a id="join-button" class="primary-button" href="in-game.html">Join</a>
    </section>
  </main>

  <script>
    const joinButton = document.getElementById("join-button");
    joinButton.addEventListener("click", () => {
      joinButton.textContent = "Update";
    });
  </script>
</body>

</html>
